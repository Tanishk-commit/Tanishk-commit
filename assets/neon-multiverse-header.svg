<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Tanishk Kekan — Neon Multiverse</title>
  <desc id="desc">A futuristic cyan, violet and magenta developer banner with circuit details, stars, the name Tanishk Kekan, and the motto Build, Innovate, Evolve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030817"/>
      <stop offset=".48" stop-color="#10103a"/>
      <stop offset="1" stop-color="#25082e"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66f7ff"/>
      <stop offset=".48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff4fc8"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1030" cy="68" r="230" fill="url(#orb)"/>
  <circle cx="170" cy="270" r="190" fill="url(#orb)"/>
  <g fill="#dffbff">
    <circle cx="128" cy="73" r="1.7"/><circle cx="185" cy="218" r="1.3"/><circle cx="264" cy="45" r="1.5"/>
    <circle cx="923" cy="39" r="1.8"/><circle cx="1047" cy="119" r="1.4"/><circle cx="1112" cy="213" r="1.7"/>
    <circle cx="1000" cy="256" r="1.2"/><circle cx="75" cy="166" r="1.3"/><circle cx="1081" cy="63" r="1.3"/>
    <circle cx="332" cy="253" r="1.2"/><circle cx="866" cy="252" r="1.4"/><circle cx="956" cy="187" r="1.2"/>
  </g>
  <g fill="none" stroke="url(#lineGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 48H105L127 70H185L205 50H260"/>
    <path d="M0 65H48L61 78H90" opacity=".65"/>
    <path d="M1200 49H1092L1072 69H1014L996 51H952"/>
    <path d="M1200 68H1152L1139 81H1110" opacity=".65"/>
    <path d="M0 235H82L102 215H145L164 234H208"/>
    <path d="M1200 230H1114L1094 210H1050L1032 229H992"/>
  </g>
  <g fill="#00e5ff">
    <circle cx="105" cy="48" r="3"/><circle cx="260" cy="50" r="3"/><circle cx="82" cy="235" r="3"/>
  </g>
  <g fill="#ff4fc8">
    <circle cx="1092" cy="49" r="3"/><circle cx="952" cy="51" r="3"/><circle cx="1114" cy="230" r="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="117" font-size="61" font-weight="900" letter-spacing="3" fill="#11112b" opacity=".9">TANISHK KEKAN</text>
    <text x="600" y="111" font-size="61" font-weight="900" letter-spacing="3" fill="url(#titleGradient)" stroke="#a5f3fc" stroke-opacity=".22" stroke-width="1" filter="url(#glow)">TANISHK KEKAN</text>
    <path d="M340 137H860" stroke="url(#lineGradient)" stroke-width="1.5" opacity=".8"/>
    <text x="600" y="168" font-size="17" font-weight="700" letter-spacing="4" fill="#f2f6ff">SOFTWARE ENGINEERING STUDENT</text>
    <text x="600" y="198" font-size="15" font-weight="600" letter-spacing="2.8" fill="#72efff">AI/ML  ·  COMPUTER VISION  ·  FULL-STACK DEVELOPMENT</text>
    <text x="600" y="249" font-size="21" font-weight="800" letter-spacing="4" fill="#5ef4ff">BUILD</text>
    <text x="700" y="249" font-size="21" font-weight="700" fill="#a78bfa">→</text>
    <text x="790" y="249" font-size="21" font-weight="800" letter-spacing="3" fill="#c4a5ff">INNOVATE</text>
    <text x="910" y="249" font-size="21" font-weight="700" fill="#ff4fc8">→</text>
    <text x="1005" y="249" font-size="21" font-weight="800" letter-spacing="3" fill="#ff72cf">EVOLVE</text>
  </g>
  <path d="M310 280H890" stroke="url(#lineGradient)" stroke-width="1" opacity=".45"/>
</svg>